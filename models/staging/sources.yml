version: 2

sources:
  - name: chicago_taxi
    database: bigquery-public-data
    schema: chicago_taxi_trips
    description: "Chicago taxi trips public dataset provided by the City of Chicago."
    
    config:
      freshness:
        warn_after: {count: 365, period: day}
        error_after: {count: 1230, period: day}
      loaded_at_field: trip_start_timestamp

    tables:
      - name: taxi_trips
        description: "Raw taxi trip records including fares, times, locations and driver info."
        columns:
          - name: taxi_id
            description: "Unique identifier for the taxi vehicle."
          - name: trip_start_timestamp
            description: "Timestamp when the trip started. Used for freshness checks."
          - name: fare
            description: "Base fare amount in USD."
          - name: tips
            description: "Tip amount in USD."
          - name: trip_total
            description: "Total charge including fare, tips and tolls."